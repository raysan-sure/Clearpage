name: Windows release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: windows-release-distribution
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'release' || (!github.event.release.prerelease && !github.event.release.draft && !contains(github.event.release.assets.*.name, 'ClearPage-Windows-x64.zip'))
    runs-on: windows-2022
    timeout-minutes: 40
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      RELEASE_BUILD: ${{ github.event_name != 'workflow_dispatch' && '1' || '0' }}
      RELEASE_CHANNEL: ${{ vars.CLEARPAGE_RELEASE_CHANNEL || 'production' }}
      CLEARPAGE_PAYMENT_SERVICE_URL: ${{ vars.CLEARPAGE_PAYMENT_SERVICE_URL }}
      CLEARPAGE_SIGNING_PUBLIC_KEY: ${{ vars.CLEARPAGE_SIGNING_PUBLIC_KEY }}
      CLEARPAGE_SELLER_NAME: Raysan sure
      CLEARPAGE_SUPPORT_EMAIL: sales@zynape.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Prepare automatic build version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/prepare_ci_version.py
      - name: Validate version and install Standard dependencies
        run: |
          python scripts/release.py check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.txt -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
      - name: Test payment security, PDF processing and releases
        run: |
          $env:CLEARPAGE_DATA_DIR = Join-Path $env:RUNNER_TEMP 'clearpage-tests'
          $env:CLEARPAGE_BILLING_CONFIG = Join-Path $env:RUNNER_TEMP 'absent-free-config.json'
          python -m unittest discover -s tests -t . -v
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: '22'
          cache: npm
      - name: Build current React source
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/test_checkout.mjs tests/test_download.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
      - name: Build, extract and verify Windows ZIP
        run: |
          if ($env:RELEASE_BUILD -eq '1' -and $env:RELEASE_CHANNEL -ne 'preview') {
            python scripts/standard_release.py
          } else {
            $env:CLEARPAGE_PAYMENT_SERVICE_URL = ''
            $env:CLEARPAGE_SIGNING_PUBLIC_KEY = ''
            python scripts/standard_release.py --preview
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ClearPage-Windows-verified
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  publish:
    if: github.event_name != 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: windows-release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ClearPage-Windows-verified
          path: release-assets
      - name: Publish only the verified newer stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_EXISTING: ${{ github.event_name == 'release' && '1' || '0' }}
          RELEASE_AUTO_MAIN: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
          RELEASE_PREVIEW: ${{ vars.CLEARPAGE_RELEASE_CHANNEL == 'preview' && '1' || '0' }}
        run: python scripts/publish_release.py
